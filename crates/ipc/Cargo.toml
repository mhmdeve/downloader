[package]
name = "idl-ipc"
description = "Authenticated loopback IPC service for Internet Downloader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
idl-core = { path = "../core" }
dirs = "6.0"
getrandom = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
url = "2.5.8"
